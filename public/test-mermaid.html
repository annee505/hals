<!DOCTYPE html>
<html>
<head>
    <title>Mermaid Test</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        const charts = [
            `graph LR
A[1960s] -->|Experimental Designs| B[1970s]
B -->|Increased Use of Photography| C[1980s]
C -->|Digital Art Emerges| D[1990s]
D -->|Modern Design Trends| E[Present Day]`,
            `graph TD
A[Start] --> B[Process]
B --> C{Decision}
C -->|Yes| D[Result A]
C -->|No| E[Result B]`,
            `timeline
title History of Rock
1950s : Birth of Rock and Roll
1960s : British Invasion
1970s : Punk Rock
1980s : Hair Metal`
        ];

        const container = document.getElementById('results');
        
        for (let i = 0; i < charts.length; i++) {
            const div = document.createElement('div');
            div.style.margin = '20px';
            div.style.padding = '20px';
            div.style.border = '1px solid #ccc';
            div.style.borderRadius = '8px';
            
            try {
                const { svg } = await mermaid.render(`test-${i}`, charts[i]);
                div.innerHTML = `<h3>Chart ${i+1} - SUCCESS (${svg.length} chars)</h3>${svg}`;
                div.style.background = '#e8f5e9';
            } catch (err) {
                div.innerHTML = `<h3>Chart ${i+1} - FAILED</h3><pre>${err.message || err}</pre><pre>${charts[i]}</pre>`;
                div.style.background = '#ffebee';
                // cleanup orphan
                const orphan = document.getElementById(`test-${i}`);
                if (orphan) orphan.remove();
            }
            
            container.appendChild(div);
        }
    </script>
</head>
<body style="font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1>Mermaid Rendering Test</h1>
    <div id="results"></div>
</body>
</html>
